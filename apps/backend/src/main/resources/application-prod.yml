spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.aicc: INFO
    org.springframework: WARN
  # logback-spring.xml handles JSON format in prod profile — no pattern override needed

management:
  endpoints:
    web:
      exposure:
        # In prod: expose only what the observability stack needs
        include: health,prometheus,info
  endpoint:
    health:
      show-details: always   # Grafana/k8s need the details; gate via network policy

server:
  tomcat:
    max-threads: 200
    accept-count: 100
