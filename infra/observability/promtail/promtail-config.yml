server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

# ── Push logs to Loki ─────────────────────────────────────────────────────────
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # Collect logs from all Docker containers via the Docker socket
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=aicc"]
    relabel_configs:
      # Use container name as the main label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      # Preserve log stream (stdout/stderr)
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # Add service label from compose
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      # Parse JSON logs from Spring Boot (Logback JSON encoder)
      - json:
          expressions:
            level: level
            logger: logger_name
            message: message
      - labels:
          level:
          logger:
