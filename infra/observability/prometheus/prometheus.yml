global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    project: aicc

# ── Alert rules (extend later) ────────────────────────────────────────────────
rule_files: []

# ── Scrape targets ────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Spring Boot backend — exposes /actuator/prometheus
  # host.docker.internal resolves to the host machine from inside Docker
  - job_name: aicc-backend
    metrics_path: /actuator/prometheus
    scrape_interval: 5s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          service: backend

  # MinIO metrics
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio

  # PostgreSQL via postgres_exporter (add later if needed)
  # - job_name: postgres
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]
